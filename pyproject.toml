[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpm-2-measurement-quote-engine"
version = "2.0.0"
description = "TPM 2.0 PCR Measurement & Remote Quote Attestation Supervisor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tpm-2-measurement-quote-engine = "tpm2_attestation.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/tpm-2-measurement-quote-engine"
Repository = "https://github.com/abusuraihsakhri/tpm-2-measurement-quote-engine.git"
